name: Release

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        run: |
          version="$(node -p "require('./extension/manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$version already exists. Bump \"version\" in extension/manifest.json to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package
        if: steps.version.outputs.exists == 'false'
        id: package
        run: echo "zip=$(./scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "${{ steps.package.outputs.zip }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
